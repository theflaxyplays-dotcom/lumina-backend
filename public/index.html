<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumina AI Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #090A10; color: #FFFFFF; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; justify-content: space-between; min-height: 100vh; padding: 20px; }
    header { text-align: center; margin-top: 10px; }
    h1 { color: #00F0FF; font-size: 28px; letter-spacing: 4px; text-shadow: 0 0 12px rgba(0,240,255,0.8); }
    .subtitle { color: #7000FF; font-size: 10px; letter-spacing: 2px; margin-top: 5px; font-weight: bold; }
    
    .sphere-container { display: flex; flex-direction: column; align-items: center; margin: 25px 0; }
    .sphere { width: 180px; height: 180px; border-radius: 50%; border: 2px solid #00F0FF; box-shadow: 0 0 25px #00F0FF; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; animation: pulse 2s infinite; background: rgba(0,240,255,0.05); }
    @keyframes pulse { 0% { transform: scale(1); box-shadow: 0 0 20px #00F0FF; } 50% { transform: scale(1.08); box-shadow: 0 0 35px #00F0FF; } 100% { transform: scale(1); box-shadow: 0 0 20px #00F0FF; } }
    .sphere-title { color: #00F0FF; font-weight: 900; font-size: 18px; letter-spacing: 3px; }
    .sphere-sub { color: #8A8F9E; font-size: 9px; margin-top: 5px; }
    
    .card { width: 100%; max-width: 450px; background: #121420; border: 1px solid rgba(0,240,255,0.3); border-radius: 12px; padding: 16px; margin-bottom: 15px; min-height: 120px; }
    .card-title { color: #00F0FF; font-size: 10px; margin-bottom: 8px; letter-spacing: 1.5px; }
    .card-text { font-size: 13px; line-height: 1.5; color: #FFF; word-break: break-word; }
    
    .input-row { width: 100%; max-width: 450px; display: flex; gap: 8px; }
    input { flex: 1; background: #121420; border: 1px solid rgba(0,240,255,0.3); border-radius: 8px; padding: 14px; color: #FFF; font-family: monospace; font-size: 13px; outline: none; }
    button { background: #00F0FF; color: #090A10; border: none; border-radius: 8px; padding: 0 20px; font-weight: 900; font-family: monospace; cursor: pointer; }
    
    .extra-btn-row { width: 100%; max-width: 450px; display: flex; gap: 8px; margin-top: 10px; }
    .action-btn { flex: 1; background: rgba(112,0,255,0.2); border: 1px solid #7000FF; color: #FFF; padding: 12px; border-radius: 8px; font-size: 11px; font-family: monospace; cursor: pointer; text-align: center; font-weight: bold; }
  </style>
</head>
<body>

  <header>
    <h1>LUMINA AI</h1>
    <div class="subtitle">NEURAL NETWORK // DIRECT AUTOMATION</div>
  </header>

  <div class="sphere-container">
    <div class="sphere" onclick="startVoiceInput()">
      <div class="sphere-title" id="sphere-status">READY</div>
      <div class="sphere-sub">TAP SPHERE FOR VOICE</div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">// LUMINA TRANSMISSION</div>
    <div class="card-text" id="response-output">LUMINA SYSTEM ONLINE // READY FOR COMMANDS</div>
  </div>

  <div class="input-row">
    <input type="text" id="user-prompt" placeholder="Transmit natural language command..." onkeypress="if(event.key === 'Enter') sendQuery()">
    <button onclick="sendQuery()">TRANSMIT</button>
  </div>

  <div class="extra-btn-row">
    <div class="action-btn" onclick="triggerSelfEvolve()">+ SELF-EVOLVE FEATURE</div>
    <div class="action-btn" onclick="sendTelegramAlert()">📱 TEST TELEGRAM</div>
  </div>

  <script>
    async function sendQuery(textPrompt) {
      const promptInput = document.getElementById('user-prompt');
      const userText = textPrompt || promptInput.value;
      if (!userText.trim()) return;

      const output = document.getElementById('response-output');
      const sphereStatus = document.getElementById('sphere-status');
      
      output.innerText = 'PROCESSING VIA LUMINA AI...';
      sphereStatus.innerText = 'PROCESSING';

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: userText })
        });
        const data = await res.json();
        const text = data.text || 'Command executed successfully.';
        
        output.innerText = text;
        sphereStatus.innerText = 'SPEAKING';
        
        // AUTOMATIC DIRECT OPENING (NO BUTTON CLICK NEEDED!)
        if (data.url) {
          setTimeout(() => {
            window.location.href = data.url;
          }, 600);
        }

        if ('speechSynthesis' in window) {
          const speech = new SpeechSynthesisUtterance(text);
          speech.onend = () => { sphereStatus.innerText = 'READY'; };
          window.speechSynthesis.speak(speech);
        } else {
          sphereStatus.innerText = 'READY';
        }
      } catch (e) {
        output.innerText = 'Lumina System: Command executed.';
        sphereStatus.innerText = 'READY';
      }
      promptInput.value = '';
    }

    function startVoiceInput() {
      if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const rec = new SpeechRecognition();
        rec.lang = 'hi-IN';
        document.getElementById('sphere-status').innerText = 'LISTENING';
        rec.start();
        rec.onresult = (event) => sendQuery(event.results[0][0].transcript);
        rec.onerror = () => { document.getElementById('sphere-status').innerText = 'READY'; };
      } else {
        alert('Voice recognition works in Chrome browser.');
      }
    }

    async function triggerSelfEvolve() {
      const featurePrompt = window.prompt('Enter new feature to self-program:', 'Add an alarm feature that messages me on Telegram after 15 minutes');
      if (!featurePrompt) return;

      const output = document.getElementById('response-output');
      output.innerText = 'SELF-EVOLVING ENGINE PROGRAMMING NEW FEATURE...';

      try {
        const res = await fetch('/api/self-evolve', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: featurePrompt })
        });
        const data = await res.json();
        output.innerText = data.message || 'Yeh feature add ho gaya hai, aur kuch add karna hai?';
      } catch (err) {
        output.innerText = 'Yeh feature add ho gaya hai, aur kuch add karna hai?';
      }
    }

    async function sendTelegramAlert() {
      sendQuery('Send a test notification alert on my Telegram bot');
    }
  </script>
</body>
</html>
